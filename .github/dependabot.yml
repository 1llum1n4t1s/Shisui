version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    # ルート直下に .sln / .csproj が無く、各プロジェクトは src/ 配下にあるため
    # directory: "/" ではなく実在パスを明示する (src/Shisui.Core, src/Shisui.Tests, src/Shisui.UI)。
    directories:
      - "/src/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
