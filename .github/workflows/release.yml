name: Release

# 署名付き Velopack リリース (PerMachine MSI) を GitHub Actions で作り、R2 (shisui.kagayoi.com) へ配信する。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune) が Certum SimplySign のクラウド鍵で行う。
#   本人の PC や SimplySign Desktop は不要。vpk の署名に加え、Program Files 補正後の MSI 再署名も同じ経路で行う。
# - 起動: main の commit に付けた軽量タグ v<x.y.z> の push (/vava がタグを push すると始まる)。
#   手動実行 (workflow_dispatch) は、同じタグを指定した再実行にだけ使う (gh workflow run release.yml --ref v<x.y.z>)。
#   guard job がタグ・commit・版を確かめ、Environment "release" は版タグだけを許可する。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# - WiX は vpk に同梱されているため、ランナーへの追加導入は不要。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す。
# スクリプトはクリーンな作業ツリーと HEAD の一致を要求するため、実行前にリポジトリ内へ何も書かない。
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルドと署名・検証だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  # タグ・commit・版の一致を、Environment も Secrets も無い job で先に確かめる。
  guard:
    name: タグ検査
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では配信しない: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグの形ではない: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          version="${GITHUB_REF_NAME#v}"
          # 軽量タグで、いまもこの commit を指すこと
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type+" "+.object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグが $GITHUB_SHA を指す軽量タグではない"; exit 1; }
          # 既定ブランチの祖先であること (depth=1 の checkout では誤判定するため compare API で見る)
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status+" "+(.behind_by|tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではない ($cmp)"; exit 1; }
          # 版ファイルとの一致
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/Directory.Build.props?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw' | sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' | head -1)"
          [[ "$file" == "$version" ]] || { echo "::error::版ファイル $file とタグ $version が違う"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # 署名・R2 配信より前に既存のビルドと回帰テストを通す。失敗したら release job は動かない。
  test:
    name: テスト
    needs: guard
    uses: ./.github/workflows/dependency-validation.yml

  release:
    needs: [guard, test]
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.1.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          # global.json が無いためテスト (dependency-validation.yml) と同じ指定にする (スクリプトは .NET 11 を要求する)。
          dotnet-version: 11.0.x

      - name: Sigilune を導入
        uses: 1llum1n4t1s/Sigilune@v1

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          # 作業ディレクトリはスクリプトの制約どおりユーザー Temp の Codex\Shisui 配下に置く。
          $work = Join-Path ([IO.Path]::GetTempPath()) "Codex\Shisui\release-$env:GITHUB_RUN_ID"
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          $arguments = @{ WorkDirectory = $work; SourceGitSha = $env:GITHUB_SHA }
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shisui-release-packages
          path: |
            ${{ env.WORK_DIR }}/packages/*
            ${{ env.WORK_DIR }}/verified-release-artifacts.json
          if-no-files-found: warn
          retention-days: 7
